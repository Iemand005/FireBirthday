<!DOCTYPE html>
<html lang="nl">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>HAPPY BIRTHDAY!</title>
	<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
	<style>
		body {
			font-family: Arial, sans-serif;
			margin: 0;
			padding: 0;
			min-height: 100vh;
			position: relative;
			overflow: hidden;
		}
		
		/* Cake iframe as full background */
		iframe {
			position: absolute;
			top: 0;
			left: 0;
			width: 100%;
			height: 100%;
			border: none;
			z-index: -1;
		}
		
		/* Shaded container for text and button */
		.header-container {
			position: relative;
			z-index: 1;
			background: rgba(0, 0, 0, 0.5);
			padding: 20px;
			text-align: center;
			width: 100%;
		}
		
		h1 {
			font-size: 3rem;
			color: white;
			margin: 0;
			padding: 10px 0;
		}
		
		.confetti-button {
			padding: 12px 24px;
			font-size: 1.2rem;
			background: #ff6b6b;
			color: white;
			border: none;
			border-radius: 8px;
			cursor: pointer;
			transition: background 0.3s;
			margin-top: 10px;
		}
		.confetti-button:hover {
			background: #ff5252;
		}
	</style>
</head>
<body>
	<iframe src="https://Iemand005.github.io/FenixWeb/Cake" frameborder="0"></iframe>
	
	<div class="header-container">
		<h1>Happy birthday Nicholas!</h1>
		<button class="confetti-button" onclick="toggleConfetti()">Surprise!</button>
	</div>
	
	<script>
		let confettiInterval;
		const colors = ['#ff0000', '#00ff00', '#0000ff', '#ffff00', '#ff00ff', '#00ffff', '#ff8000', '#ff0080'];
		
		function startConfetti() {
			// Stop any existing interval
			if (confettiInterval) clearInterval(confettiInterval);
			
			// Fire initial burst
			fireSingleBurst();
			
			// Then keep firing slowly every 2 seconds
			confettiInterval = setInterval(fireSingleBurst, 2000);
		}
		
		function fireSingleBurst() {
			confetti({
				particleCount: 20,
				startVelocity: 25,
				spread: 60,
				origin: { x: Math.random(), y: Math.random() },
				colors: colors,
				shapes: ['circle'],
				scalar: 1.0
			});
		}
		
		// Auto-start on page load
		window.addEventListener('load', () => {
			setTimeout(startConfetti, 1000);
		});
		
		// Button starts/stops confetti
		function toggleConfetti() {
			if (confettiInterval) {
				clearInterval(confettiInterval);
				confettiInterval = null;
			} else {
				startConfetti();
			}
		}
	</script>
	</script>
</body>
</html>
