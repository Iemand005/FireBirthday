<!DOCTYPE html>
<html lang="nl">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>HAPPY BIRTHDAY!</title>
	<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
	<style>
		body {
			text-align: center;
			padding: 50px;
			font-family: Arial, sans-serif;
			background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
			min-height: 100vh;
			margin: 0;
			display: flex;
			flex-direction: column;
			justify-content: center;
			align-items: center;
		}
		h1 {
			font-size: 3rem;
			color: #333;
			margin-bottom: 20px;
		}
		.confetti-button {
			padding: 12px 24px;
			font-size: 1.2rem;
			background: #ff6b6b;
			color: white;
			border: none;
			border-radius: 8px;
			cursor: pointer;
			transition: background 0.3s;
		}
		.confetti-button:hover {
			background: #ff5252;
		}
	</style>
</head>
<body>
	<h1>Happy birthday Nicholas!</h1>
	<button class="confetti-button" onclick="fireConfetti()">Surprise!</button>

	<iframe src="https://Iemand005.github.io/FenixWeb/Cake" frameborder="0"></iframe>
	
	<script>
		function fireConfetti() {
			const colors = ['#ff0000', '#00ff00', '#0000ff', '#ffff00', '#ff00ff', '#00ffff', '#ff8000', '#ff0080'];
			
			// Fire 8 bursts from random positions
			for (let i = 0; i < 8; i++) {
				setTimeout(() => {
					confetti({
						particleCount: 25,
						startVelocity: 25,
						spread: 60,
						origin: { x: Math.random(), y: Math.random() },
						colors: colors,
						shapes: ['circle'],
						scalar: 1.0
					});
				}, i * 150);
			}
		}
		
		// Auto-trigger once on page load
		window.addEventListener('load', () => {
			setTimeout(fireConfetti, 1000);
		});
	</script>
</body>
</html>
