<!DOCTYPE html>
<html lang="nl">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>HAPPY BIRTHDAY!</title>
	<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
	<style>
		body {
			text-align: center;
			padding: 50px;
			font-family: Arial, sans-serif;
			background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
			min-height: 100vh;
			margin: 0;
			display: flex;
			flex-direction: column;
			justify-content: center;
			align-items: center;
		}
		h1 {
			font-size: 3rem;
			color: #333;
			margin-bottom: 20px;
		}
		.confetti-button {
			padding: 12px 24px;
			font-size: 1.2rem;
			background: #ff6b6b;
			color: white;
			border: none;
			border-radius: 8px;
			cursor: pointer;
			transition: background 0.3s;
		}
		.confetti-button:hover {
			background: #ff5252;
		}
	</style>
</head>
<body>
	<h1>Happy birthday Nick!</h1>
	<button class="confetti-button" onclick="fireConfetti()">🎉 Surprise! 🎉</button>
	
	<script>
		function fireConfetti() {
			// Fire multiple rounds of confetti
			const end = Date.now() + 5000; // 5 seconds of confetti
			
			const colors = ['#ff0000', '#00ff00', '#0000ff', '#ffff00', '#ff00ff', '#00ffff', '#ff8000', '#ff0080'];
			
			const frame = () => {
				if (Date.now() > end) return;
				
				confetti({
					particleCount: 2,
					startVelocity: 30,
					spread: 100,
					origin: { x: Math.random(), y: Math.random() },
					colors: colors,
					shapes: ['circle', 'square'],
					scalar: 1.2
				});
				
				confetti({
					particleCount: 2,
					startVelocity: 30,
					spread: 100,
					origin: { x: Math.random(), y: Math.random() },
					colors: colors,
					shapes: ['circle', 'square'],
					scalar: 1.2
				});
				
				requestAnimationFrame(frame);
			};
			
			// Initial bursts
			for (let i = 0; i < 5; i++) {
				setTimeout(() => {
					confetti({
						particleCount: 100,
						startVelocity: 30,
						spread: 100,
						origin: { x: Math.random(), y: Math.random() },
						colors: colors,
						shapes: ['circle', 'square'],
						scalar: 1.2
					});
				}, i * 500);
			}
			
			// Continuous stream
			frame();
		}
		
		// Auto-trigger confetti on page load
		window.addEventListener('load', () => {
			setTimeout(fireConfetti, 1000);
		});
	</script>
</body>
</html>
